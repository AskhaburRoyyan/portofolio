<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askhabur Royyan — Web Developer Laravel</title>
  <meta name="description" content="Portofolio Askhabur Royyan, web developer Laravel dari Tuban. Membangun sistem informasi untuk yayasan, kampus, dan organisasi.">
  <meta property="og:title" content="Askhabur Royyan — Web Developer Laravel">
  <meta property="og:description" content="Sistem informasi berbasis web untuk organisasi di Tuban.">
  <meta property="og:image" content="assets/img/profile.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#proyek">Langsung ke proyek</a>

  <header class="nav">
    <div class="wrap nav-in">
      <a class="nav-name" href="#top" id="navName"></a>
      <nav aria-label="Navigasi utama">
        <a href="#proyek">Proyek</a>
        <a href="#keahlian">Keahlian</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <p class="hero-role" id="heroRole"></p>
      <h1 class="hero-name" id="heroName"></h1>
      <p class="hero-intro" id="heroIntro"></p>
      <div class="hero-actions">
        <a class="btn btn-solid" href="#proyek">Lihat proyek</a>
        <a class="btn btn-line" href="#kontak">Hubungi saya</a>
      </div>
      <p class="hero-loc" id="heroLoc"></p>
    </section>

    <section class="sec wrap" id="proyek" aria-labelledby="h-proyek">
      <h2 class="sec-h" id="h-proyek">Proyek</h2>
      <div id="projectList"></div>
    </section>

    <section class="sec wrap" id="keahlian" aria-labelledby="h-keahlian">
      <h2 class="sec-h" id="h-keahlian">Keahlian</h2>
      <div class="skills" id="skillList"></div>
    </section>

    <section class="sec wrap" id="tentang" aria-labelledby="h-tentang">
      <h2 class="sec-h" id="h-tentang">Tentang saya</h2>
      <div class="about">
        <img class="about-photo" id="aboutPhoto" alt="" width="400" height="480" loading="lazy">
        <div class="about-text" id="aboutText"></div>
      </div>
    </section>

    <section class="sec wrap contact" id="kontak" aria-labelledby="h-kontak">
      <h2 class="sec-h" id="h-kontak">Kontak</h2>
      <p class="contact-lead">Terbuka untuk proyek freelance, magang, dan pekerjaan penuh waktu.</p>
      <div id="contactMain"></div>
      <ul class="contact-links" id="contactLinks"></ul>
    </section>
  </main>

  <footer class="wrap foot">
    <p id="footText"></p>
  </footer>

  <dialog class="viewer" id="viewer" aria-label="Pratinjau screenshot">
    <button class="viewer-close" id="viewerClose" aria-label="Tutup">×</button>
    <img id="viewerImg" alt="">
  </dialog>

  <noscript><p class="wrap">Aktifkan JavaScript untuk melihat isi portofolio.</p></noscript>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
